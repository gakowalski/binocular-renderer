name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify relative production assets
        run: |
          grep -q 'src="./assets/' dist/index.html
          if grep -Eq '(src|href)="/assets/' dist/index.html; then
            echo "Absolute production asset path found in dist/index.html"
            exit 1
          fi
